<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Form</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f4f4f4;
      font-family: Arial, sans-serif;
    }
    .form-container {
      width: 40%;
      background-color: #254776;
      padding: 20px;
      margin: 40px auto;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      color: white;
    }
    h1, legend {
      text-align: center;
      color: white;
    }
    .form-control {
      background-color: #f4f4f4;
      border: 1px solid white;
      color: #333;
    }
    .form-check-input {
      background-color: #f4f4f4;
      border: 1px solid white;
    }
    .btn-submit {
      background-color: grey;
      color: white;
      border: none;
      width: 100%;
      padding: 10px;
      border-radius: 5px;
      font-size: 16px;
    }
    .btn-submit:hover {
      background-color: #6c757d;
    }
  </style>
</head>
<body>
  <div class="form-container">
    <form>
      <h1>Contact Us</h1>
      <fieldset>
        <legend>Send us a message</legend>
        <div class="mb-3">
          <label for="name" class="form-label">Name</label>
          <input type="text" id="name" class="form-control" placeholder="First and last name">
        </div>
        <div class="mb-3">
          <label for="email" class="form-label">Email</label>
          <input type="email" id="email" class="form-control" placeholder="address@example.com">
        </div>
        <div class="mb-3">
          <label for="phone" class="form-label">Phone</label>
          <input type="tel" id="phone" class="form-control" placeholder="(123) 456-7890">
        </div>
        <h4 class="mt-4">Gender</h4>
        <div class="d-flex justify-content-between px-3 mb-3">
          <div class="form-check">
            <input type="checkbox" id="male" class="form-check-input" name="gender" value="Male">
            <label for="male" class="form-check-label">Male</label>
          </div>
          <div class="form-check">
            <input type="checkbox" id="female" class="form-check-input" name="gender" value="Female">
            <label for="female" class="form-check-label">Female</label>
          </div>
        </div>
        <h4>Preferred Contact</h4>
        <div class="d-flex justify-content-between px-3 mb-3">
          <div class="form-check">
            <input type="radio" id="emailContact" class="form-check-input" name="preferredContact" value="Email">
            <label for="emailContact" class="form-check-label">Email</label>
          </div>
          <div class="form-check">
            <input type="radio" id="phoneContact" class="form-check-input" name="preferredContact" value="Phone">
            <label for="phoneContact" class="form-check-label">Phone</label>
          </div>
        </div>
        <legend>Comments and Questions</legend>
        <div class="mb-3">
          <label for="comments" class="form-label">Questions?</label>
          <textarea id="comments" class="form-control" placeholder="Type your questions here"></textarea>
        </div>
        <button type="submit" class="btn btn-submit">Submit</button>
      </fieldset>
    </form>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
